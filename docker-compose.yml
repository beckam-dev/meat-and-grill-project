services:

  postgres:
    image: postgres:18

    container_name: meatandgrill-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: meatandgrill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meatandgrill"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .

    container_name: meat-grill-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/meatandgrill
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

volumes:
  postgres-data: