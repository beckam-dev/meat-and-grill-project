name: CI con Docker para Tablas de Postgres

on:
  push:
    branches: [ "feature/docker-ci-db-tablas" ]
    paths:
      - Dockerfile
      - db/**

permissions:
  contents: read
  packages: write
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}/postgres-custom-v2 \
            .

      - name: Publicar imagen
        run: |
          docker push ghcr.io/${{ github.repository }}/postgres-custom-v2

  test:
    needs: build
    name: Prueba de creación de tablas en Postgres dentro de contenedor Docker
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: ghcr.io/${{ github.repository }}/postgres-custom-v2
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: db_prueba_tablas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verificar tablas
        run: |
          psql -h localhost -U postgres -d db_prueba_tablas -c "\dt"
        env:
          PGPASSWORD: postgres