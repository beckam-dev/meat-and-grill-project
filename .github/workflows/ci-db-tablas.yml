name: CI para Tablas de Postgres

on:
  push:
    branches: [ "feature/ci-db-tablas" ]
    
jobs:
  test:
    name: Prueba de creación de tablas en Postgres
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: db_prueba_tablas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Crear tablas
        run: psql -h localhost -U postgres -d db_prueba_tablas -f db/01_create_tables.sql
        env:
          PGPASSWORD: postgres