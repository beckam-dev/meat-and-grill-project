name: Prueba de GitHub Actions

on:
  workflow_dispatch:
  push:
    branches: [ "feature/estructura-github-actions" ]

jobs:
  test:
    name: Prueba del runner de GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar información del runner
        run: |
          echo "GitHub Actions funcionando correctamente"
          echo "Runner: $RUNNER_NAME"
          echo "Sistema operativo: $RUNNER_OS"
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Rama: $GITHUB_REF_NAME"

      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Listar archivos
        run: ls -la