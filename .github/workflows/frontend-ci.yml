
name: Demo Control de Calidad (Exposición)

on:
  push:
    branches:
      - feature/frontend-ui
      - master
      - main

jobs:
  analisis-codigo:
    name:  Escaneo de Seguridad del Frontend
    runs-on: ubuntu-latest

    steps:
    - name:  1. Clonar repositorio
      uses: actions/checkout@v4

    - name:  2. Buscar Credenciales Expuestas (Secret Scanning)
      run: |
        echo " Iniciando escaneo de seguridad en busca de tokens o llaves expuestas..."
        echo "Análisis: Comprobando archivos de configuración... OK"
        echo "Análisis: Verificando variables de entorno... OKK"
        echo " No se encontraron credenciales ni llaves expuestas en el código fuente."

    - name:  3. Validar Sintaxis y Buenas Prácticas
      run: |
        echo " Verificando estándares de código en componentes de Angular..."
        echo "Check: Estructura semántica de componentes HTML... Pasado"
        echo "Check: Convención de nombres en TypeScript... Pasado"
        echo " ¡Código limpio! Cumple con los estándares para producción."
