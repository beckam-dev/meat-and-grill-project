name:  Demo Control de Calidad (Exposición)

on:
  push:
    branches:
      - feature/frontend-ui
      - master
      - main

jobs:
  control-calidad:
    name:  Validación de Código en la Nube
    runs-on: ubuntu-latest

    steps:
    - name:  1. Clonar repositorio en servidor seguro
      uses: actions/checkout@v4

    - name:  2. Verificar entorno Node.js institucional
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name:  3. Validar arquitectura (Presencia de archivos clave)
      run: |
        echo "🔍 Verificando estructura del proyecto..."
        test -f package.json && echo " package.json detectado" || (echo " package.json ausente" && exit 1)
        test -d src && echo " Carpeta de código fuente 'src' localizada" || (echo " Carpeta 'src' ausente" && exit 1)

    - name:  4. Simular Tests Unitarios del Panel de Mesero
      run: |
        echo " Iniciando batería de pruebas automatizadas..."
        echo "Testing: Componente Mesero cargado con colores institucionales... OK"
        echo "Testing: Módulo de cocina recibiendo comandas en tiempo real... OK"
        echo " ¡Felicidades! El código cumple con el 100% de los estándares de calidad del restaurante."